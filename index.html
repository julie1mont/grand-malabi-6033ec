<!-- Cutline / Digital Wawa — craft design marketplace -->
<!-- ============================================================
     SETUP (do this once before deploying):
     1. Create a free project at https://supabase.com
     2. In the SQL editor, run the schema at the bottom of this
        comment block.
     3. In Storage, create a bucket called "design-files" (private).
     4. In Authentication > Users, manually add yourself as a user
        (email + password) — that's the login you'll use to publish.
     5. In Project Settings > API, copy your Project URL and anon
        public key into SUPABASE_URL and SUPABASE_ANON_KEY below.
     6. Deploy this single file at https://app.netlify.com/drop
        (drag and drop — no build step needed) to get a live link.

     -- SQL to run in Supabase's SQL editor --
     create table listings (
       id uuid primary key default gen_random_uuid(),
       title text not null,
       category text not null,
       price numeric not null,
       formats text[] not null,
       description text,
       creator text default 'Digital Wawa',
       sales int default 0,
       pattern int default 0,
       file_path text,
       created_at timestamptz default now()
     );
     alter table listings enable row level security;
     create policy "public read" on listings for select using (true);
     create policy "owner insert" on listings for insert with check (auth.role() = 'authenticated');
     create policy "owner delete" on listings for delete using (auth.role() = 'authenticated');
     ============================================================ -->

    {id:'s6', title:'Blessed & faith monogram frames', category:'Clipart', price:4.00, formats:['SVG','PNG'], creator:'Digital Wawa', sales:410, pat:9, desc:'Two decorative script frames for monogramming — pair with any single letter font.'},
    {id:'s7', title:'Winter berries seamless pattern', category:'Patterns', price:6.00, formats:['PNG','PDF'], creator:'Digital Wawa', sales:301, pat:3, desc:'A tileable winter berry print, 300dpi, ready for sublimation or fabric printing.'},
    {id:'s8', title:'Faux leather floral sheet', category:'Sublimation', price:3.75, formats:['PNG','PDF'], creator:'Digital Wawa', sales:528, pat:5, desc:'Printable faux-leather texture with a soft floral overlay, sized for earring blanks.'},
    {id:'s9', title:'Gingham picnic border', category:'Patterns', price:2.00, formats:['SVG','PNG'], creator:'Digital Wawa', sales:190, pat:1, desc:'A classic gingham border strip for cards, labels, and packaging.'},
    {id:'s10', title:'Autumn leaves heart set', category:'SVGs', price:4.50, formats:['SVG','PNG','DXF','EPS','PDF'], creator:'Digital Wawa', sales:1780, pat:7, desc:'Four layered leaf-heart designs for fall tees and totes, tested on 100% cotton.'},
    {id:'s11', title:'Snowflake grid clipart', category:'Illustrations', price:2.25, formats:['SVG','PNG'], creator:'Digital Wawa', sales:266, pat:0, desc:'A set of six geometric snowflakes, evenly weighted for small-scale cutting.'},
    {id:'s12', title:'Coffee shop rubber stamp set', category:'Templates', price:3.25, formats:['SVG','PNG','PDF'], creator:'Digital Wawa', sales:174, pat:6, desc:'Four faux-stamp graphics for packaging and stickers.'},
  ];
  const categories = ['All','SVGs','Illustrations','Templates','Clipart','Sublimation','Patterns'];

  let state = { view:'browse', activeCategory:'All', search:'', productId:null, userListings:[], cart:{}, cartOpen:false, session:null, authError:'', resetMessage:'', resetError:'' };

  const $ = sel => document.querySelector(sel);
  const main = $('#cl-main');
  const fmt = n => '$' + Number(n).toFixed(2);

  function allListings(){ return [...state.userListings, ...seed]; }

  // ---------------- cart: browser-local, works on any host ----------------
  function loadCart(){
    try { state.cart = JSON.parse(localStorage.getItem('dw-cart') || '{}'); } catch(e){ state.cart = {}; }
  }
  function saveCart(){
    localStorage.setItem('dw-cart', JSON.stringify(state.cart));
  }

  // ---------------- listings: Supabase-backed ----------------
  async function loadListings(){
    if(!supabaseReady){ state.userListings = []; return; }
    const { data, error } = await supabase.from('listings').select('*').order('created_at', { ascending:false });
    if(error){ console.error(error); state.userListings = []; return; }
    state.userListings = (data||[]).map(row => ({
      id: row.id, title: row.title, category: row.category, price: Number(row.price),
      formats: row.formats||[], desc: row.description||'', creator: row.creator||'Digital Wawa',
      sales: row.sales||0, pat: row.pattern||0, filePath: row.file_path
    }));
  }

  async function publishListing({title, category, price, formats, desc, file}){
    if(!supabaseReady) throw new Error('Connect Supabase first — see the setup comment at the top of this file.');
    if(!state.session) throw new Error('Sign in before publishing.');
    let file_path = null;
    if(file){
      const path = `${Date.now()}-${file.name}`;
      const { error: upErr } = await supabase.storage.from('design-files').upload(path, file);
      if(upErr) throw upErr;
      file_path = path;
    }
    const { error } = await supabase.from('listings').insert({
      title, category, price, formats, description: desc, creator: 'Digital Wawa',
      pattern: Math.floor(Math.random()*10), file_path
    });
    if(error) throw error;
    await loadListings();
  }

  async function deleteListing(id){
    if(!supabaseReady) return;
    const { error } = await supabase.from('listings').delete().eq('id', id);
    if(error){ console.error(error); return; }
    await loadListings();
  }

  function addToCart(id){ state.cart[id] = (state.cart[id]||0) + 1; saveCart(); renderCartBits(); }
  function setQty(id, qty){ if (qty<=0) delete state.cart[id]; else state.cart[id]=qty; saveCart(); renderCartBits(); }

  function cardHtml(item){
    const formats = item.formats.map(f=>`<span>${f}</span>`).join('');
    return `
      <div class="cl-card" data-open="${item.id}">
        <div class="thumb pat-${item.pat}"><span class="badge mono">${item.formats[0]||''}</span></div>
        <div class="body">
          <div class="title">${item.title}</div>
          <div class="creator">${item.creator}</div>
          <div class="formats">${formats}</div>
          <div class="foot">
            <span class="price mono">${fmt(item.price)}</span>
            <button class="add" data-add="${item.id}">Add to cart</button>
          </div>
        </div>
      </div>`;
  }

  function filteredList(){
    return allListings().filter(i=>{
      const catOk = state.activeCategory==='All' || i.category===state.activeCategory;
      const q = state.search.trim().toLowerCase();
      const searchOk = !q || i.title.toLowerCase().includes(q) || i.creator.toLowerCase().includes(q);
      return catOk && searchOk;
    });
  }

  function renderBrowse(){
    const list = filteredList();
    const counts = {};
    allListings().forEach(i=>{ counts[i.category]=(counts[i.category]||0)+1; });

    main.innerHTML = `
      <section id="cl-hero" class="grid-bg">
        <div class="wrap hero-inner">
          <div>
            <h1 class="display">Cut files, fonts, and templates<br>for your next project.</h1>
            <p class="sub">Ready-to-cut designs for Cricut, Silhouette, and print — every one made by Digital Wawa.</p>
            <div id="cl-search">
              <input id="cl-search-input" type="text" placeholder="Search svgs, templates, patterns..." value="${state.search}">
              <button id="cl-search-btn">Search</button>
            </div>
            <div class="quick"><span>Popular:</span>
              <button data-quick="hearts">hearts</button>
              <button data-quick="christmas">christmas</button>
              <button data-quick="monogram">monogram</button>
            </div>
          </div>
          <div id="cl-hero-art">
            <div class="swatch s1 pat-0"><span class="tag mono">SVG · DXF</span></div>
            <div class="swatch s2 pat-1"><span class="tag mono">$4.50</span></div>
          </div>
        </div>
      </section>

      <section id="cl-cats" class="wrap">
        <div class="row">
          ${categories.map(c=>`
            <button data-cat="${c}" class="${c===state.activeCategory?'active':''}">
              ${c} ${c!=='All' ? `<span class="count">${counts[c]||0}</span>` : ''}
            </button>`).join('')}
        </div>
      </section>

      <section class="wrap">
        <div id="cl-section-title">
          <h2 class="display">${state.activeCategory==='All' ? 'Fresh in the library' : state.activeCategory}</h2>
          <div class="meta">${list.length} result${list.length===1?'':'s'}</div>
        </div>
        <div id="cl-grid">
          ${list.length ? list.map(cardHtml).join('') : `<div class="empty-box" style="grid-column:1/-1">No designs match that search. Try a different word or category.</div>`}
        </div>
      </section>

      <section id="cl-sell-banner">
        <div class="wrap inner">
          <div>
            <h2 class="display">New designs added regularly.</h2>
            <p>Every SVG, template, and pattern here is made in-house by Digital Wawa — check back often for fresh drops.</p>
          </div>
        </div>
      </section>
    `;

    $('#cl-search-input').addEventListener('input', e=>{ state.search = e.target.value; renderGridOnly(); });
    $('#cl-search-btn').addEventListener('click', renderBrowse);
    main.querySelectorAll('[data-cat]').forEach(b=> b.addEventListener('click', ()=>{ state.activeCategory=b.dataset.cat; renderBrowse(); }));
    main.querySelectorAll('[data-quick]').forEach(b=> b.addEventListener('click', ()=>{ state.search=b.dataset.quick; renderBrowse(); }));
    main.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', (e)=>{ if(e.target.closest('[data-add]')) return; openProduct(el.dataset.open); }));
    main.querySelectorAll('[data-add]').forEach(el=> el.addEventListener('click', (e)=>{ e.stopPropagation(); addToCart(el.dataset.add); flashAdded(el); }));
  }

  function renderGridOnly(){
    const grid = $('#cl-grid');
    const title = $('#cl-section-title .meta');
    if(!grid) return;
    const list = filteredList();
    grid.innerHTML = list.length ? list.map(cardHtml).join('') : `<div class="empty-box" style="grid-column:1/-1">No designs match that search. Try a different word or category.</div>`;
    if(title) title.textContent = `${list.length} result${list.length===1?'':'s'}`;
    grid.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', (e)=>{ if(e.target.closest('[data-add]')) return; openProduct(el.dataset.open); }));
    grid.querySelectorAll('[data-add]').forEach(el=> el.addEventListener('click', (e)=>{ e.stopPropagation(); addToCart(el.dataset.add); flashAdded(el); }));
  }

  function flashAdded(btn){ const orig = btn.textContent; btn.textContent = 'Added'; setTimeout(()=>{ btn.textContent = orig; }, 900); }

  function openProduct(id){ state.productId = id; state.view = 'product'; setNav('product', true); render(); window.scrollTo({top:0, behavior:'instant'}); }

  function renderProduct(){
    const item = allListings().find(i=>i.id===state.productId);
    if(!item){ renderBrowse(); return; }
    main.innerHTML = `
      <div class="wrap" id="cl-detail">
        <button id="cl-back">&larr; Back to browse</button>
        <div class="detail-grid">
          <div class="detail-thumb pat-${item.pat}"><span class="badge mono">${item.formats.join(' / ')}</span></div>
          <div class="detail-info">
            <h1 class="display">${item.title}</h1>
            <div class="creator-line">by ${item.creator} &middot; ${item.sales||0} downloads</div>
            <div class="price mono">${fmt(item.price)}</div>
            <div class="formats">${item.formats.map(f=>`<span>${f}</span>`).join('')}</div>
            <div class="desc">${item.desc||''}</div>
            <div class="buy-row">
              <button class="add" data-add="${item.id}">Add to cart</button>
              <button class="buy" data-buy="${item.id}">Buy now</button>
            </div>
            <div class="license"><b>License:</b> Personal &amp; small-batch commercial use (up to 250 physical items) is included. Each format downloads as a zip once payment is confirmed.</div>
          </div>
        </div>
      </div>
    `;
    $('#cl-back').addEventListener('click', ()=>{ state.view='browse'; setNav('browse', true); render(); });
    main.querySelector('[data-add]').addEventListener('click', (e)=>{ addToCart(item.id); flashAdded(e.target); });
    main.querySelector('[data-buy]').addEventListener('click', ()=>{ addToCart(item.id); openCart(); });
  }

  function renderResetPassword(){
    main.innerHTML = `
      <div class="wrap" id="cl-sell">
        <h1 class="display">Set a new password</h1>
        <p class="lede">You followed a password reset link. Choose a new password below.</p>
        <div class="sell-form" style="max-width:380px">
          <form id="cl-newpw-form">
            <div class="field"><label>New password</label><input type="password" id="np-password" minlength="6" required></div>
            <div class="field"><label>Confirm new password</label><input type="password" id="np-password2" minlength="6" required></div>
            <button type="submit" class="submit">Save new password</button>
            ${state.resetError ? `<div class="error">${state.resetError}</div>` : ''}
          </form>
        </div>
      </div>`;
    $('#cl-newpw-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const p1 = $('#np-password').value, p2 = $('#np-password2').value;
      if(p1 !== p2){ state.resetError = "Passwords don't match."; renderResetPassword(); return; }
      const { error } = await supabase.auth.updateUser({ password: p1 });
      if(error){ state.resetError = error.message; renderResetPassword(); return; }
      state.resetError = '';
      state.view = 'sell';
      const { data } = await supabase.auth.getSession();
      state.session = data.session;
      await loadListings();
      setNav('sell', true);
      render();
    });
  }

  function renderSell(){
    if(!supabaseReady){
      main.innerHTML = `
        <div class="wrap" id="cl-sell">
          <h1 class="display">Digital Wawa</h1>
          <p class="lede">This page isn't connected to a backend yet.</p>
          <div class="empty-box">Add your Supabase project URL and anon key near the top of this file's script (look for SUPABASE_URL and SUPABASE_ANON_KEY) to enable real, saved listings and file uploads. Setup steps are in the comment at the very top of the file.</div>
        </div>`;
      return;
    }
    if(!state.session){
      main.innerHTML = `
        <div class="wrap" id="cl-sell">
          <h1 class="display">Digital Wawa</h1>
          <p class="lede">Sign in to publish and manage your designs.</p>
          <div class="sell-form" style="max-width:380px">
            <h3>Sign in</h3>
            <form id="cl-signin-form">
              <div class="field"><label>Email</label><input type="email" id="si-email" required></div>
              <div class="field"><label>Password</label><input type="password" id="si-password" required></div>
              <button type="submit" class="submit">Sign in</button>
              ${state.authError ? `<div class="error">${state.authError}</div>` : ''}
              <button type="button" id="cl-forgot-link" class="ci-remove" style="margin-top:10px;">Forgot password?</button>
              ${state.resetMessage ? `<div class="note" style="color:var(--mat-dark)">${state.resetMessage}</div>` : ''}
              <div class="note">Create your account first in the Supabase dashboard under Authentication &gt; Users — this form signs in with that email and password.</div>
            </form>
          </div>
        </div>`;
      $('#cl-signin-form').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const email = $('#si-email').value.trim();
        const password = $('#si-password').value;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if(error){ state.authError = error.message; renderSell(); return; }
        state.session = data.session; state.authError = '';
        await loadListings();
        renderSell();
      });
      $('#cl-forgot-link').addEventListener('click', async ()=>{
        const email = $('#si-email').value.trim();
        if(!email){ state.authError = 'Type your email above first, then click "Forgot password?"'; renderSell(); return; }
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
        state.authError = '';
        state.resetMessage = error ? '' : 'Check your email for a password reset link.';
        if(error) state.authError = error.message;
        renderSell();
      });
      return;
    }

    const mine = state.userListings;
    const totalRevenue = mine.reduce((sum,i)=> sum + (i.price * (i.sales||0)), 0);
    const totalSales = mine.reduce((sum,i)=> sum + (i.sales||0), 0);
    main.innerHTML = `
      <div class="wrap" id="cl-sell">
        <h1 class="display">Digital Wawa</h1>
        <p class="lede">Upload a design once and it appears in your library right away.</p>
        <div class="signed-in-row"><span>Signed in as ${state.session.user.email}</span><button id="cl-signout">Sign out</button></div>
        <div class="sell-grid">
          <div class="sell-form">
            <h3>Publish a new design</h3>
            <form id="cl-upload-form">
              <div class="field"><label>Title</label><input type="text" id="f-title" placeholder="e.g. Autumn leaves heart set" required></div>
              <div class="field"><label>Category</label>
                <select id="f-cat">${categories.filter(c=>c!=='All').map(c=>`<option>${c}</option>`).join('')}</select>
              </div>
              <div class="field"><label>Price (USD)</label><input type="number" id="f-price" min="0.5" step="0.25" placeholder="4.50" required></div>
              <div class="field"><label>File formats included</label>
                <div class="fmt-row">
                  ${['SVG','PNG','DXF','EPS','PDF'].map(f=>`<label><input type="checkbox" value="${f}"> ${f}</label>`).join('')}
                </div>
              </div>
              <div class="field"><label>Description</label><textarea id="f-desc" placeholder="What is it, and what should buyers know before cutting or printing it?"></textarea></div>
              <div class="field"><label>Design file (zip your SVG/PNG/DXF/etc. together)</label><input type="file" id="f-file"></div>
              <button type="submit" class="submit">Publish design</button>
              <div id="cl-upload-error" class="error"></div>
              <div class="note">Uploaded files are stored privately in Supabase. Automatic delivery to buyers after payment needs the Stripe step — not wired up yet.</div>
            </form>
          </div>
          <div>
            <div class="stat-row">
              <div class="stat"><div class="num mono">${mine.length}</div><div class="label">Listings</div></div>
              <div class="stat"><div class="num mono">${totalSales}</div><div class="label">Downloads</div></div>
              <div class="stat"><div class="num mono">${fmt(totalRevenue)}</div><div class="label">Revenue</div></div>
            </div>
            <div class="listings-head"><h3>Your listings</h3></div>
            <div id="cl-my-listings">
              ${mine.length ? mine.map(m=>`
                <div class="listing-row">
                  <div class="sw pat-${m.pat}"></div>
                  <div class="info">
                    <div class="t">${m.title}</div>
                    <div class="m">${m.category} &middot; ${m.formats.join('/')}</div>
                  </div>
                  <div class="price">${fmt(m.price)}</div>
                  <button class="del" data-del="${m.id}">Remove</button>
                </div>
              `).join('') : `<div class="empty-box">Nothing published yet. Upload your first cut file to start selling.</div>`}
            </div>
          </div>
        </div>
      </div>
    `;
    $('#cl-signout').addEventListener('click', async ()=>{ await supabase.auth.signOut(); state.session = null; renderSell(); });
    $('#cl-upload-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const title = $('#f-title').value.trim();
      const price = parseFloat($('#f-price').value);
      const category = $('#f-cat').value;
      const desc = $('#f-desc').value.trim();
      const formats = Array.from(main.querySelectorAll('.fmt-row input:checked')).map(i=>i.value);
      const file = $('#f-file').files[0] || null;
      const errEl = $('#cl-upload-error');
      if(!title || !price || formats.length===0){ errEl.textContent = 'Add a title, price, and at least one file format.'; return; }
      errEl.textContent = '';
      try {
        await publishListing({title, category, price, formats, desc, file});
        renderSell();
      } catch(err){
        errEl.textContent = err.message || 'Something went wrong publishing that.';
      }
    });
    main.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', async ()=>{
      await deleteListing(b.dataset.del);
      renderSell();
    }));
  }

  function render(){
    if (state.view==='browse') renderBrowse();
    else if (state.view==='product') renderProduct();
    else if (state.view==='sell') renderSell();
    else if (state.view==='reset-password') renderResetPassword();
    renderCartBits();
  }

  function setNav(view, skipRender){
    state.view = view;
    document.querySelectorAll('#cl-nav [data-nav]').forEach(b=> b.classList.toggle('active', b.dataset.nav===view || (view==='product' && b.dataset.nav==='browse')));
    if(!skipRender) render();
  }
  document.querySelectorAll('#cl-nav [data-nav]').forEach(b=> b.addEventListener('click', ()=> setNav(b.dataset.nav)));

  function openCart(){ state.cartOpen = true; $('#cl-overlay').classList.add('open'); $('#cl-drawer').classList.add('open'); renderCartBits(); }
  function closeCart(){ state.cartOpen = false; $('#cl-overlay').classList.remove('open'); $('#cl-drawer').classList.remove('open'); }
  $('#cl-cart-open').addEventListener('click', openCart);
  $('#cl-cart-close').addEventListener('click', closeCart);
  $('#cl-overlay').addEventListener('click', closeCart);

  function renderCartBits(){
    const entries = Object.entries(state.cart);
    const items = entries.map(([id,qty])=>({item: allListings().find(i=>i.id===id), qty})).filter(x=>x.item);
    const count = items.reduce((s,x)=>s+x.qty,0);
    $('#cl-cart-count').textContent = count;

    const itemsEl = $('#cl-cart-items');
    if(items.length===0){
      itemsEl.innerHTML = `<div class="empty-box">Your cart is empty. Browse the library to find something to cut.</div>`;
    } else {
      itemsEl.innerHTML = items.map(({item,qty})=>`
        <div class="cart-item">
          <div class="sw pat-${item.pat}"></div>
          <div class="ci-info">
            <div class="ci-title">${item.title}</div>
            <div class="ci-row">
              <div class="qty-stepper"><button data-dec="${item.id}">&minus;</button><span>${qty}</span><button data-inc="${item.id}">+</button></div>
              <span class="ci-price mono">${fmt(item.price*qty)}</span>
            </div>
            <button class="ci-remove" data-rm="${item.id}">Remove</button>
          </div>
        </div>
      `).join('');
      itemsEl.querySelectorAll('[data-inc]').forEach(b=> b.addEventListener('click', ()=> setQty(b.dataset.inc, (state.cart[b.dataset.inc]||0)+1)));
      itemsEl.querySelectorAll('[data-dec]').forEach(b=> b.addEventListener('click', ()=> setQty(b.dataset.dec, (state.cart[b.dataset.dec]||0)-1)));
      itemsEl.querySelectorAll('[data-rm]').forEach(b=> b.addEventListener('click', ()=> setQty(b.dataset.rm, 0)));
    }

    const subtotal = items.reduce((s,x)=>s+x.item.price*x.qty,0);
    const summaryEl = $('#cl-cart-summary');
    summaryEl.innerHTML = `
      <div class="sum-row total"><span>Total</span><span class="val">${fmt(subtotal)}</span></div>
      <button id="cl-checkout-btn" ${items.length===0?'disabled':''}>Checkout</button>
      <div id="cl-checkout-note">Payments aren't wired up yet — that's the Stripe step. Once connected, this button hands off to a real checkout and unlocks downloads automatically.</div>
    `;
    const btn = $('#cl-checkout-btn');
    if(btn) btn.addEventListener('click', ()=>{ if(items.length===0) return; alert("Checkout isn't connected to a payment processor yet."); });
  }

  async function init(){
    loadCart();
    if(supabaseReady){
      supabase.auth.onAuthStateChange((event, session)=>{
        if(event === 'PASSWORD_RECOVERY'){
          state.session = session;
          state.view = 'reset-password';
          render();
        }
      });
      const { data } = await supabase.auth.getSession();
      state.session = data.session || null;
      await loadListings();
    }
    render();
  }
  init();
})();
</script>
